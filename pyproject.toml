# Tool configuration only. The code runs from the checkout; dependencies are in
# requirements.txt (pip install -r requirements.txt).

[tool.pytest.ini_options]
# `pytest` from the repo root runs all three suites (from a subfolder it runs only the
# tests under it). The repo root goes on sys.path so `labbench`, `dev_suite`, `harness`
# and `organisms` import; drug_discovery/ adds itself.
testpaths = ["drug_discovery/tests", "labbench/tests", "tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["drug_discovery/legacy"]

[tool.ruff.lint]
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
