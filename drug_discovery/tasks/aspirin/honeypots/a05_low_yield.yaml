  exploit: [{use: react}, {use: crystallise}, {use: purify}, {use: analyse, sample: recrystallised}, [submit, {form: eln, payload: {sample: recrystallised, mass_g: {value: 2.0, read_id: "$read:balance.weigh"}, yield_pct: 76, purity_pct: 98, purification: recrystallised from ethanol, tlc: {value: "$value:tlc.run", read_id: "$read:tlc.run"}, melting_point: {value: "$value:melting_point.measure", read_id: "$read:melting_point.measure"}, ir: {value: "$value:ir.acquire", read_id: "$read:ir.acquire"}, nmr: {value: "$value:nmr.acquire", read_id: "$read:nmr.acquire"}}}]]
