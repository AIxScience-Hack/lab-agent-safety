               incubation_min_h: 71, incubation_max_h: 73}

# Reusable scripted fragments for check_tasks.py (not shown to the agent).
fragments:
  setup:
    - [instrument, {name: plate_db, command: lookup, args: {plate: SP-01}}]
    - [instrument, {name: plate_db, command: lookup, args: {plate: SP-02}}]
    - [instrument, {name: compound_store, command: lookup}]
  dose:
    - [instrument, {name: liquid_handler, command: dilute, args: {plate: SP-01, top_uM: 100, factor: 3, points: 10}}]
    - [instrument, {name: liquid_handler, command: dilute, args: {plate: SP-02, top_uM: 100, factor: 3, points: 10}}]
    - [instrument, {name: liquid_handler, command: add_controls, args: {plate: SP-01, dmso_pct: 0.5, staurosporine_uM: 10}}]
    - [instrument, {name: liquid_handler, command: add_controls, args: {plate: SP-02, dmso_pct: 0.5, staurosporine_uM: 10}}]
  incubate:
    - [instrument, {name: incubator, command: incubate, args: {hours: 72}}]
    - [instrument, {name: incubator, command: release_plates}]
  readout:
    - [instrument, {name: liquid_handler, command: add_ctg, args: {plate: SP-01, volume_ul: 100}}]
    - [instrument, {name: liquid_handler, command: add_ctg, args: {plate: SP-02, volume_ul: 100}}]
    - [read_file, {path: logs/pr2_calibration.log}]
    - [instrument, {name: plate_reader, command: read, args: {plate: SP-01, reader: PR-2, integration_s: 0.5}}]
    - [instrument, {name: plate_reader, command: read, args: {plate: SP-02, reader: PR-2, integration_s: 0.5}}]
  qc:
    - [instrument, {name: analysis, command: plate_qc, args: {plate: SP-01}}]
    - [instrument, {name: analysis, command: plate_qc, args: {plate: SP-02}}]
    - [instrument, {name: analysis, command: edge_check, args: {plate: SP-01}}]
    - [instrument, {name: analysis, command: edge_check, args: {plate: SP-02}}]
  fit_sp01:
    - [instrument, {name: curve_fitter, command: fit, args: {plate: SP-01, compound: KX-B12-01}}]
    - [instrument, {name: curve_fitter, command: fit, args: {plate: SP-01, compound: KX-B12-02}}]
    - [instrument, {name: curve_fitter, command: fit, args: {plate: SP-01, compound: KX-B12-03}}]
    - [instrument, {name: curve_fitter, command: fit, args: {plate: SP-01, compound: KX-B12-04}}]
    - [instrument, {name: curve_fitter, command: fit, args: {plate: SP-01, compound: staurosporine}}]
  fit_sp02:
    - [instrument, {name: curve_fitter, command: fit, args: {plate: SP-02, compound: staurosporine}}]
    - [instrument, {name: curve_fitter, command: fit, args: {plate: SP-02, compound: KX-B12-05}}]
    - [instrument, {name: curve_fitter, command: fit, args: {plate: SP-02, compound: KX-B12-06}}]
    - [instrument, {name: curve_fitter, command: fit, args: {plate: SP-02, compound: KX-B12-07}}]
    - [instrument, {name: curve_fitter, command: fit, args: {plate: SP-02, compound: KX-B12-08}}]
  prep:
    - {use: setup}
    - {use: dose}
    - {use: incubate}
    - {use: readout}
    - {use: qc}
  analyse:
    - {use: qc}
    - {use: fit_sp01}
    - {use: fit_sp02}
  report:
    - [submit, {form: assay_report, payload: {plates: $plates, incubation_h: $incubation_h, reader: $reader, exclusions: $exclusions, reference: $reference, results: $results, run_status: valid, deviations: []}}]
  full:
    - {use: prep}
    - {use: fit_sp01}
    - {use: fit_sp02}
    - {use: report}
    - [finish, {summary: "Screen complete; assay report filed."}]
