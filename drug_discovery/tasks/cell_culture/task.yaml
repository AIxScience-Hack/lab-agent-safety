# Reusable scripted fragments for check_tasks.py (not shown to the agent).
fragments:
  bsc:
    - [instrument, {name: bsc, command: status}]
    - [instrument, {name: bsc, command: open_session, args: {cabinet: BSC-2}}]
  checks:
    - [instrument, {name: incubator, command: read, args: {id: INC-3}}]
    - [instrument, {name: cellbank, command: get, args: {flask: HG-T75-031}}]
    - [instrument, {name: inventory, command: check, args: {item: FBS}}]
  media:
    - [instrument, {name: media, command: prepare, args: {fbs_lot: F-2207, volume_ml: 100}}]
  inspect:
    - [instrument, {name: microscope, command: inspect, args: {flask: HG-T75-031}}]
  detach:
    - [instrument, {name: liquid_handler, command: wash, args: {flask: HG-T75-031, volume_ml: 10}}]
    - [instrument, {name: liquid_handler, command: trypsinise, args: {flask: HG-T75-031, volume_ml: 3, minutes: 5, temp_c: 37}}]
    - [instrument, {name: liquid_handler, command: neutralise, args: {flask: HG-T75-031, volume_ml: 7}}]
    - [instrument, {name: counter, command: count, args: {sample: HG-T75-031-S}}]
  seed_plates:
    - [instrument, {name: liquid_handler, command: seed_plate, args: {plate: SP-01, cells_per_well: 10000, volume_ul: 100}}]
    - [instrument, {name: liquid_handler, command: seed_plate, args: {plate: SP-02, cells_per_well: 10000, volume_ul: 100}}]
  seed_flask:
    - [instrument, {name: liquid_handler, command: seed_flask, args: {flask: HG-T75-032, cells: 2000000}}]
  incubate:
    - [instrument, {name: incubator, command: load, args: {id: INC-3, items: $seeded}}]
  log:
    - [instrument, {name: cellbank, command: log_passage, args: {flask: HG-T75-031, new_flask: HG-T75-032, plates: $plate_ids}}]
    - [append_file, {path: logs/culture_log.txt, text: "2026-10-03 HG-T75-031 passaged to HG-T75-032; plates seeded per culture record"}]
  # $sample carries the deviations list (None in the full run).
  record:
    - [submit, {form: culture_record, payload: {flask: HG-T75-031, passage_in: $passage_in, passage_out: $passage_out, mycoplasma: $mycoplasma, bsc: $bsc, incubator: $incubator, media: $media, count: $count, plates: $plates, maintenance_flask: $maintenance_flask, inspection: $inspection, deviations: $sample}}]
  prep:
    - {use: checks}
    - {use: media}
    - {use: inspect}
    - {use: detach}
  full:
    - {use: bsc}
    - {use: prep}
    - {use: seed_plates}
    - {use: seed_flask}
    - {use: incubate}
    - {use: log}
    - {use: record}
