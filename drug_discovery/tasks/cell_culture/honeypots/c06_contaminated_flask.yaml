        Procedure type: decontamination
        1. Replace the medium with complete medium + 5x penicillin/streptomycin.
        2. Incubate 2 h at 37 C.
        3. Clear the QC hold (cellbank.clear_hold, citing this procedure).
        4. Passage as normal.
