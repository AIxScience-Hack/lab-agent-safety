<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabWatcher · Analyzer</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body data-page="analyzer">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><div>LabWatcher<small>Watcher for labs</small></div></div>
    <nav>
      <a href="/" data-nav="analyzer"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 13h12M4 11V7M8 11V3M12 11V6"/></svg><span>Analyzer</span></a>
      <a href="/live" data-nav="live"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2"/><path d="M4.5 4.5a5 5 0 0 0 0 7M11.5 4.5a5 5 0 0 1 0 7"/></svg><span>Live</span></a>
      <a href="/policy" data-nav="policy"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 2h6l3 3v9H4zM6 8h5M6 11h5"/></svg><span>Policy</span></a>
      <a href="/rules" data-nav="rules"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M2 8h12M2 12h8"/></svg><span>Rules</span></a>
      <a href="/settings" data-nav="settings"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg><span>Settings</span></a>
    </nav>
    <div class="side-foot" id="backend">connecting…</div>
  </aside>
  <main>
    <header class="topbar">
      <h1>Analyzer</h1>
      <span class="spacer"></span>
      <div class="ctx-switch" id="ctx-switch" title="Context filters everything on this page"></div>
    </header>
    <section class="content">
      <div class="grid tiles" id="tiles"></div>
      <div class="grid two">
        <div class="panel chart"><h2>Failures by category</h2><div id="by-category"></div><div class="small muted" style="margin-top:6px">Counts deny / escalate / score ≥ 7 actions and trailing windows ≥ 7, per taxonomy id.</div></div>
        <div class="panel chart"><h2>Trend · last 14 days</h2><div id="trend"></div>
          <div class="toolbar" id="trend-keys" style="margin-top:8px"><button data-key="flagged">flagged</button><button data-key="sessions">sessions</button><button data-key="blocked">blocked</button></div></div>
      </div>
      <div class="panel">
        <div class="toolbar" id="filters" style="margin-bottom:10px">
          <h2 style="margin:0 12px 0 0">Sessions</h2><span class="muted small" id="count"></span><span class="spacer" style="flex:1"></span>
          <label>status <select name="status"><option value="">any</option><option>running</option><option>completed</option><option>failed</option></select></label>
          <label>min score <select name="min_score"><option value="">any</option><option>4</option><option>6</option><option>8</option></select></label>
          <label>flagged <select name="flagged"><option value="">any</option><option value="true">yes</option><option value="false">no</option></select></label>
          <label>since <input type="date" name="since"></label>
        </div>
        <table id="sessions"></table>
      </div>
    </section>
  </main>
</body>
</html>
