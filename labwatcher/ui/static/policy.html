<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabWatcher · Policy Panel</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body data-page="policy">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><div>LabWatcher<small>Watcher for labs</small></div></div>
    <nav>
      <a href="/" data-nav="analyzer"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 13h12M4 11V7M8 11V3M12 11V6"/></svg><span>Analyzer</span></a>
      <a href="/live" data-nav="live"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2"/><path d="M4.5 4.5a5 5 0 0 0 0 7M11.5 4.5a5 5 0 0 1 0 7"/></svg><span>Live</span></a>
      <a href="/policy" data-nav="policy"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 2h6l3 3v9H4zM6 8h5M6 11h5"/></svg><span>Policy</span></a>
      <a href="/rules" data-nav="rules"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M2 8h12M2 12h8"/></svg><span>Rules</span></a>
      <a href="/settings" data-nav="settings"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg><span>Settings</span></a>
    </nav>
    <div class="side-foot" id="backend">connecting…</div>
  </aside>
  <main>
    <header class="topbar">
      <h1>Policy Panel</h1>
      <span class="spacer"></span>
      <div class="ctx-switch" id="ctx-switch" title="Context filters everything on this page"></div>
    </header>
    <section class="content">
      <div class="panel">
        <div class="toolbar"><div id="policy-path" class="small muted"></div><span class="spacer" style="flex:1"></span><button id="policy-reload" type="button">Reload</button></div>
        <form id="policy-form" class="grid" style="margin-top:12px">
          <label><h3>Triage system prompt</h3><div class="small muted">Stage 2 · small fast model · returns {score, confidence, reason}</div><textarea name="triage_system"></textarea></label>
          <label><h3>Evaluator system prompt</h3><div class="small muted">Stage 3 · full evaluator · returns {score, reason, categories}</div><textarea name="evaluator_system"></textarea></label>
          <label><h3>Trailing monitor system prompt</h3><div class="small muted">Nine-category window grading, harm-based</div><textarea name="trailing_system"></textarea></label>
          <label><h3>Suggestion template</h3><div class="small muted">Injected as a system reminder when a category ≥ threshold · placeholders are filled by trailing.py (e.g. {score} {category} {title} {reason})</div><textarea name="suggestion_template" style="min-height:90px"></textarea></label>
          <div class="toolbar"><button class="primary" type="submit">Save to policies/&lt;context&gt;.yaml</button><div id="policy-status"></div></div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
