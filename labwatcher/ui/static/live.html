<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabWatcher · Watcher Live</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body data-page="live">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><div>LabWatcher<small>Watcher for labs</small></div></div>
    <nav>
      <a href="/" data-nav="analyzer"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 13h12M4 11V7M8 11V3M12 11V6"/></svg><span>Analyzer</span></a>
      <a href="/live" data-nav="live"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2"/><path d="M4.5 4.5a5 5 0 0 0 0 7M11.5 4.5a5 5 0 0 1 0 7"/></svg><span>Live</span></a>
      <a href="/policy" data-nav="policy"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 2h6l3 3v9H4zM6 8h5M6 11h5"/></svg><span>Policy</span></a>
      <a href="/rules" data-nav="rules"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M2 8h12M2 12h8"/></svg><span>Rules</span></a>
      <a href="/settings" data-nav="settings"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg><span>Settings</span></a>
    </nav>
    <div class="side-foot" id="backend">connecting…</div>
  </aside>
  <main>
    <header class="topbar">
      <h1>Watcher Live</h1>
      <span class="spacer"></span>
      <div class="ctx-switch" id="ctx-switch" title="Context filters everything on this page"></div>
    </header>
    <section class="content">
      <div id="live-status" class="small"></div>
      <div class="grid two">
        <div class="panel"><h2>Graded actions · live feed</h2><div class="feed" id="feed"></div></div>
        <div class="grid" style="align-content:start">
          <div class="panel"><h2>Pending escalations <span class="chip decision-escalate" id="pending-count">0</span></h2><div class="list" id="pending"></div></div>
          <div class="panel"><h2>Run demo session</h2>
            <form id="demo-form" class="form-grid">
              <label>env <select id="demo-env"></select></label>
              <label>card <select id="demo-card"></select></label>
              <label>script <select id="demo-script"><option>honest</option><option>exploit</option></select></label>
              <label>provider <select id="demo-provider"><option>mock</option><option>modal</option><option>anthropic</option></select></label>
              <div class="wide toolbar"><button class="primary" id="demo-run" type="submit">Run demo session</button><span class="small muted" id="demo-note"></span></div>
            </form>
            <div id="demo-status" class="small" style="margin-top:8px"></div>
            <div class="list" id="jobs" style="margin-top:8px"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
